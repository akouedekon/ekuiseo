# ============================================================
# Ekuiseo — site nginx de l'HOTE pour ekuiseo.com (serveur partage)
# ============================================================
# A copier dans /etc/nginx/sites-available/ekuiseo.com puis activer :
#   sudo ln -s /etc/nginx/sites-available/ekuiseo.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d ekuiseo.com -d www.ekuiseo.com   # ajoute le bloc TLS
#
# Ce fichier ne concerne QUE ekuiseo.com : il n'altere pas les autres sites
# (server_name distincts). Il relaie vers le Caddy d'Ekuiseo publie sur
# 127.0.0.1:8090 (EKUISEO_HTTP_PORT dans .env / docker-compose.vps.yml).
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name ekuiseo.com www.ekuiseo.com;

    # Certbot (challenge HTTP-01) : laisser passer avant toute redirection.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        client_max_body_size 10m;
    }
}
