name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Evite d'accumuler des runs concurrents obsoletes sur la meme branche/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    # Pas de service postgis ici : les tests d'integration (classes *IT, maven-failsafe)
    # demarrent leur propre PostGIS via Testcontainers (image postgis/postgis:16-3.4,
    # voir backend/src/test/java/bj/ekuiseo/api/integration/AbstractPostgisIT.java) sur
    # le Docker fourni par ubuntu-latest. L'ancien service etait inutilise (constat F433).
    # Aucune variable JWT_SECRET/DB_* non plus : le profil de test "it"
    # (src/test/resources/application-it.yml) porte sa propre configuration.
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer le JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      # Phase test : tests unitaires (surefire, *Test). Phases integration-test/verify :
      # tests d'integration (failsafe, *IT) sur PostGIS reel. Un echec de l'un ou l'autre
      # casse le build ; -DskipITs permet de ne jouer que les unitaires en local sans Docker.
      - name: "Compiler et tester (mvn verify : unitaires + integration)"
        working-directory: backend
        run: mvn -B verify

      - name: Publier les rapports de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7

      # Veille de dependances (constats F018/F430), volontairement NON bloquante : le
      # rapport sert a preparer les montees de version, Dependabot (.github/dependabot.yml)
      # ouvre les PR. OWASP dependency-check n'est pas utilise ici : il exige une cle NVD
      # et plusieurs minutes de telechargement a chaque run.
      - name: Mises a jour de dependances disponibles (informatif)
        working-directory: backend
        continue-on-error: true
        run: >-
          mvn -B -ntp
          org.codehaus.mojo:versions-maven-plugin:2.21.0:display-dependency-updates
          org.codehaus.mojo:versions-maven-plugin:2.21.0:display-plugin-updates

  frontend:
    name: Frontend (npm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dependances (npm ci)
        run: npm ci

      # Non bloquant au depart (constat F430) : le rapport est lu, les correctifs
      # arrivent par Dependabot. A rendre bloquant une fois la base assainie.
      - name: Audit de securite npm (informatif)
        run: npm audit --audit-level=high || true

      - name: Lint (oxlint)
        run: npm run lint

      - name: Tests unitaires (vitest)
        run: npm test

      - name: Verification des types + build de production
        run: npm run build
        env:
          # Valeur factice suffisante pour valider le build ; la vraie valeur est
          # injectee au build de l'image Docker (voir frontend/Dockerfile, ARG VITE_API_URL).
          VITE_API_URL: https://ci-build-placeholder.invalid

      # Budget de taille (reseau degrade assume, terminaux d'entree de gamme : CLAUDE.md).
      # Mesure sur le JS et le CSS de dist/assets compresses en gzip, tel que Caddy/nginx
      # les servent. Seuils calibres avec une marge sur le build de reference
      # (JS total ~690 Kio gzip, dont ~235 Kio pour l'entree index) ; les depasser doit
      # etre une decision (nouvelle dependance lourde), pas une derive silencieuse.
      - name: Budget de taille du build
        env:
          BUDGET_JS_TOTAL_KIB: 900
          BUDGET_JS_ENTRY_KIB: 320
          BUDGET_CSS_TOTAL_KIB: 60
        run: |
          set -euo pipefail
          gz() { gzip -9c "$1" | wc -c; }
          js_total=0; css_total=0; entry=0
          printf '%10s  %s\n' 'gzip (o)' 'fichier'
          for f in dist/assets/*.js; do
            s=$(gz "$f"); js_total=$((js_total + s))
            case "$(basename "$f")" in index-*.js) entry=$((entry + s));; esac
            printf '%10d  %s\n' "$s" "$(basename "$f")"
          done
          for f in dist/assets/*.css; do
            s=$(gz "$f"); css_total=$((css_total + s))
            printf '%10d  %s\n' "$s" "$(basename "$f")"
          done
          echo "JS total : $((js_total / 1024)) Kio gzip (budget ${BUDGET_JS_TOTAL_KIB})"
          echo "JS entree index : $((entry / 1024)) Kio gzip (budget ${BUDGET_JS_ENTRY_KIB})"
          echo "CSS total : $((css_total / 1024)) Kio gzip (budget ${BUDGET_CSS_TOTAL_KIB})"
          status=0
          if [ $((js_total / 1024)) -gt "$BUDGET_JS_TOTAL_KIB" ]; then
            echo "::error::Budget JS total depasse : $((js_total / 1024)) Kio > ${BUDGET_JS_TOTAL_KIB} Kio"; status=1; fi
          if [ $((entry / 1024)) -gt "$BUDGET_JS_ENTRY_KIB" ]; then
            echo "::error::Budget de l'entree index depasse : $((entry / 1024)) Kio > ${BUDGET_JS_ENTRY_KIB} Kio"; status=1; fi
          if [ $((css_total / 1024)) -gt "$BUDGET_CSS_TOTAL_KIB" ]; then
            echo "::error::Budget CSS depasse : $((css_total / 1024)) Kio > ${BUDGET_CSS_TOTAL_KIB} Kio"; status=1; fi
          exit $status

      - name: Publier le build (dist/)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  docker-images:
    name: Images Docker (build ; publication sur main)
    # Construit les deux images a chaque run (une PR valide que les Dockerfiles passent) et
    # les PUBLIE dans GitHub Container Registry uniquement sur un push de main (constat
    # F437) : ghcr.io/akouedekon/ekuiseo-{backend,frontend}:<sha> et :main. Le workflow
    # deploy-prod.yml fait ensuite tirer le tag <sha> par le VPS (scripts/deploy-vps.sh),
    # qui ne construit plus rien ; le retour arriere relance le tag precedent.
    #
    # Reglages GitHub attendus (Settings du depot) :
    #  - Packages : apres la premiere publication, rendre les deux paquets PUBLICS
    #    (package settings -> Change visibility) pour que le VPS les tire sans jeton ;
    #    sinon `docker login ghcr.io` sur le serveur avec un jeton read:packages
    #    (docs/DEPLOIEMENT.md §14) ;
    #  - Variables (Settings -> Secrets and variables -> Actions -> Variables) :
    #    VITE_API_URL (vide en production : API servie sous le meme domaine),
    #    VITE_MAP_STYLE_URL (fond de carte MapTiler, vide = trace schematique),
    #    VITE_SUPPORT_EMAIL (adresse de support, contact@ekuiseo.com par defaut).
    #    Vite fige ces valeurs dans le bundle AU BUILD : une variable absente vaut la
    #    valeur par defaut ci-dessous, et un changement impose un nouveau build.
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NS: ghcr.io/akouedekon
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN suffit pour publier dans le registre du depot ; aucun secret a creer.
      - name: Se connecter a GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire (et publier) l'image backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ env.IMAGE_NS }}/ekuiseo-backend:${{ github.sha }}
            ${{ env.IMAGE_NS }}/ekuiseo-backend:main
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Construire (et publier) l'image frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ env.IMAGE_NS }}/ekuiseo-frontend:${{ github.sha }}
            ${{ env.IMAGE_NS }}/ekuiseo-frontend:main
          # Lues depuis les variables du depot (voir l'en-tete du job) ; vides sinon,
          # sauf l'adresse de support qui garde la valeur par defaut du Dockerfile.
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_MAP_STYLE_URL=${{ vars.VITE_MAP_STYLE_URL }}
            VITE_SUPPORT_EMAIL=${{ vars.VITE_SUPPORT_EMAIL || 'contact@ekuiseo.com' }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  e2e:
    name: Tests de bout en bout (Playwright)
    # Constats F435/F143 (phase 6) : parcours reels (inscription + code, recherche et reservation
    # en especes, publication, annulation, litige conducteur absent, accord conducteur,
    # reversement) contre la pile Docker de dev
    # (docker-compose.yml + docker-compose.e2e.yml : Kkiapay simule, codes de connexion
    # journalises en clair) et le jeu de demonstration + e2e/seed-e2e.sql.
    # NON BLOQUANT au premier passage : `continue-on-error: true` a retirer une fois le job
    # stabilise (deux runs verts consecutifs), pour qu'un parcours casse bloque le deploiement.
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    env:
      COMPOSE_FILES: -f docker-compose.yml -f docker-compose.e2e.yml
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      # Valeurs de developpement uniquement (cle JWT jetable, mot de passe local) : aucun
      # secret n'est necessaire, scripts/seed-demo.sh exige simplement un .env.
      - name: Preparer la configuration de developpement
        run: cp .env.example .env

      - name: Demarrer la pile (PostGIS, API, Vite)
        run: docker compose $COMPOSE_FILES up -d --build

      - name: Attendre l'API et le front
        run: bash e2e/scripts/wait-for-stack.sh

      - name: Charger le jeu de donnees (demo + trajet E2E)
        run: bash e2e/scripts/seed.sh

      - name: Installer Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit

      - name: Lancer les parcours
        working-directory: e2e
        run: npm test

      - name: Journaux de la pile (diagnostic)
        if: always()
        run: docker compose $COMPOSE_FILES logs --no-color --tail=800 > e2e/stack-logs.txt 2>&1 || true

      - name: Publier le rapport et les traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-playwright
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e/stack-logs.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Arreter la pile
        if: always()
        run: docker compose $COMPOSE_FILES down -v --remove-orphans || true
