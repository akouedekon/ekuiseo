spring:
  application:
    name: ekuiseo-api
  lifecycle:
    # Duree maximale laissee aux requetes en vol lors d un arret gracieux (server.shutdown).
    timeout-per-shutdown-phase: 25s
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ekuiseo}
    username: ${DB_USER:ekuiseo}
    password: ${DB_PASSWORD:ekuiseo}
    hikari:
      maximum-pool-size: 10
      # Un appel qui attend une connexion plus de 10 s echoue au lieu de s empiler.
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:10000}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mail:
    # Relais SMTP pour les codes de connexion (MAIL_MODE=smtp). Sans MAIL_HOST, aucun
    # JavaMailSender n est cree et seul le mode log fonctionne.
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:true}
      # Port 465 (Hostinger, OVH...) : TLS implicite -> MAIL_SMTP_SSL=true et MAIL_SMTP_STARTTLS=false.
      mail.smtp.ssl.enable: ${MAIL_SMTP_SSL:false}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  # Arret gracieux : Tomcat cesse d accepter et laisse finir les requetes en vol (une
  # confirmation de paiement, par exemple) avant l arret ; docker-compose.prod.yml
  # accorde 30 s (stop_grace_period) pour couvrir les 25 s ci-dessous.
  shutdown: graceful
  error:
    include-message: always

springdoc:
  # Documentation OpenAPI : utile en developpement, desactivee en production par
  # docker-compose.prod.yml (SPRINGDOC_ENABLED=false) pour ne pas publier la surface d API.
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /swagger-ui.html
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /v3/api-docs

management:
  health:
    mail:
      # L indicateur mail tente une connexion SMTP a chaque /actuator/health : actif seulement
      # en mode smtp reel, sinon un hote vide ferait passer l API en DOWN.
      enabled: ${MAIL_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        # health et info restent publics (voir SecurityConfig) ; le reste (metrics...)
        # est reserve au back-office (ROLE_ADMIN).
        include: health,info,metrics
  endpoint:
    health:
      # "when-authorized" : un appelant anonyme ne voit que UP/DOWN, jamais le detail
      # des composants (base de donnees, disque...), qui pourrait aider un attaquant.
      show-details: when-authorized

info:
  app:
    name: ekuiseo-api
    description: API de la plateforme de covoiturage Ekuiseo (Benin)

ekuiseo:
  jwt:
    # Doit faire au moins 32 octets (256 bits, requis par HS256) : JwtService refuse
    # de demarrer sinon plutot que d'affaiblir silencieusement la cle (voir JwtService).
    # Aucune valeur de repli : une cle publique (celle de l ancien .env.example) ferait
    # signer des jetons forgeables. JwtService refuse aussi toute valeur "change-me...".
    secret: ${JWT_SECRET:}
    access-token-ttl-minutes: ${JWT_ACCESS_TTL_MIN:60}
    refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
    # Borne dure d une session : au-dela, plus aucune rotation du refresh token (V11).
    refresh-absolute-ttl-days: ${JWT_REFRESH_ABSOLUTE_TTL_DAYS:90}
  booking:
    pending-payment-ttl-minutes: 20
  trip:
    # Cycle de vie (TripLifecycleScheduler) : delai apres le depart au-dela duquel un trajet
    # ONGOING est repute termine (COMPLETED) et ses reservations confirmees cloturees.
    completion-delay-hours: ${TRIP_COMPLETION_DELAY_HOURS:6}
    # Acompte de base du mode MOMO_DEPOSIT (regle metier n.21), injecte dans FeePolicy.
    # L'acompte reellement preleve est max(cette valeur, frais de service de la
    # reservation) - voir FeePolicy#computeDepositAmount pour la justification.
    deposit-base-fcfa: ${BOOKING_DEPOSIT_BASE_FCFA:1000}
  fee:
    # Parametre commercial, injecte dans FeePolicy (jamais code en dur, voir MoneyUtils/FeePolicy).
    service-fee-rate: ${SERVICE_FEE_RATE:0.08}
    rounding-step: ${FEE_ROUNDING_STEP:5}
  cors:
    # Origines autorisees (liste separee par des virgules) ; "*" par defaut.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  kkiapay:
    # "stub" (par defaut) : aucun paiement reel, simule un succes systematique (dev/tests).
    # "http" : appelle reellement l'API Kkiapay (necessite les 3 cles ci-dessous).
    mode: ${KKIAPAY_MODE:stub}
    public-key: ${KKIAPAY_PUBLIC_KEY:}
    private-key: ${KKIAPAY_PRIVATE_KEY:}
    secret: ${KKIAPAY_SECRET:}
    # Secret hash configure dans le tableau de bord Kkiapay (menu Webhook), distinct des
    # cles API ci-dessus : sert a verifier l'en-tete X-Kkiapay-Secret des webhooks recus.
    webhook-secret: ${KKIAPAY_WEBHOOK_SECRET:}
    sandbox: ${KKIAPAY_SANDBOX:true}
  sms:
    # "log" (par defaut) : journalise le SMS au lieu de l'envoyer (dev/tests).
    # "http" : appelle un fournisseur SMS HTTP configurable ci-dessous.
    mode: ${SMS_MODE:log}
    # Fournisseur en mode http : twilio, africastalking ou generic (voir SmsConfig).
    provider: ${SMS_PROVIDER:generic}
    http:
      # URL du fournisseur generique, ou URL de base de remplacement pour twilio/africastalking.
      url: ${SMS_HTTP_URL:}
      api-key: ${SMS_PROVIDER_KEY:}
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from: ${TWILIO_FROM:}
    smspartner:
      api-key: ${SMSPARTNER_API_KEY:}
      sender: ${SMSPARTNER_SENDER:}
      sandbox: ${SMSPARTNER_SANDBOX:false}
    africastalking:
      username: ${AT_USERNAME:}
      api-key: ${AT_API_KEY:}
      sender-id: ${AT_SENDER_ID:}
      sandbox: ${AT_SANDBOX:false}
    otp:
      max-attempts: ${OTP_MAX_ATTEMPTS:5}
      rate-limit:
        max-requests: ${OTP_RATE_LIMIT_MAX_REQUESTS:3}
        window-minutes: ${OTP_RATE_LIMIT_WINDOW_MINUTES:10}
  auth:
    # Comptes crees a l inscription et jamais verifies : purges apres ce delai, le numero redevient libre.
    pending-account-ttl-hours: ${PENDING_ACCOUNT_TTL_HOURS:24}
  mail:
    # "log" (par defaut) : journalise l e-mail au lieu de l envoyer (dev/tests, code lisible
    # dans les logs sous [MAIL-STUB]). "smtp" : envoi reel via spring.mail.* ci-dessus.
    mode: ${MAIL_MODE:log}
    from: ${MAIL_FROM:}
  otp:
    # Canal de livraison des codes de connexion : email (defaut) ou sms.
    channel: ${OTP_CHANNEL:email}
    # En canal email, un compte sans adresse recoit le code par SMS si true, sinon 400.
    sms-fallback: ${OTP_SMS_FALLBACK:false}
    # Journaliser les codes EN CLAIR en mode log (developpement local uniquement ; jamais
    # pose par docker-compose.prod.yml : par defaut destinataires masques, codes etoiles).
    log-plain-codes: ${OTP_LOG_PLAIN_CODES:false}
  gateways:
    # Derogation de recette : autoriser MAIL_MODE=log alors que KKIAPAY_MODE=http.
    allow-log-with-real-payments: ${EKUISEO_ALLOW_LOG_GATEWAYS:false}
  http:
    # Delais de tous les clients HTTP sortants (Kkiapay, SMS), voir HttpClientConfig.
    connect-timeout-ms: ${HTTP_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${HTTP_READ_TIMEOUT_MS:15000}
  search-alert:
    radius-km: ${SEARCH_ALERT_RADIUS_KM:10}
  search-events:
    # Duree de conservation des traces de recherche (table search_events, migration V9),
    # purgees chaque nuit par SearchEventRetentionScheduler. Duree declaree dans
    # docs/CONFORMITE.md (section 3.2) : la modifier ici impose de l'y mettre a jour.
    retention-days: ${SEARCH_EVENTS_RETENTION_DAYS:180}
  payout:
    minimum-threshold-fcfa: ${PAYOUT_MIN_THRESHOLD_FCFA:2000}
    # Une reservation n est reversable qu une fois le depart passe depuis ce delai (heures).
    eligibility-delay-hours: ${PAYOUT_ELIGIBILITY_DELAY_HOURS:24}
  refund:
    # Tentatives Kkiapay avant de basculer un remboursement en traitement manuel.
    max-attempts: ${REFUND_MAX_ATTEMPTS:5}
  subscription:
    price-fcfa: ${SUBSCRIPTION_PRICE_FCFA:2000}
  rate-limit:
    auth:
      max-requests: ${RATE_LIMIT_AUTH_MAX:20}
      window-seconds: ${RATE_LIMIT_AUTH_WINDOW_SECONDS:60}
    webhook:
      max-requests: ${RATE_LIMIT_WEBHOOK_MAX:120}
      window-seconds: ${RATE_LIMIT_WEBHOOK_WINDOW_SECONDS:60}
    # Demandes de code (/otp/request, /otp/register) : envoi reel d e-mails et enumeration
    # de numeros, quota par IP plus strict en plus du quota auth.
    otp:
      max-requests: ${RATE_LIMIT_OTP_MAX:10}
      window-seconds: ${RATE_LIMIT_OTP_WINDOW_SECONDS:600}

logging:
  level:
    bj.ekuiseo.api: INFO
