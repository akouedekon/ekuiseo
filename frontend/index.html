<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Ekuiseo — Covoiturage au Bénin</title>
    <meta
      name="description"
      content="Trajets interurbains et navettes quotidiennes partout au Bénin. Acompte de 1 000 FCFA en mobile money, solde en espèces à bord."
    />
    <meta name="theme-color" content="#2E3FA8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ekuiseo" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="color-scheme" content="light dark" />

    <!-- Partage social -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ekuiseo" />
    <meta property="og:title" content="Ekuiseo — Covoiturage au Bénin" />
    <meta
      property="og:description"
      content="Partagez la route, partagez le prix. Acompte de 1 000 FCFA, solde en espèces à bord."
    />
    <meta property="og:locale" content="fr_BJ" />

    <!--
      Ecran de chargement inline : affiche avant meme que le paquet JS
      n'arrive, ce qui compte sur une connexion 3G irreguliere.
      Il est retire par main.tsx des le premier rendu de React.
    -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #fffdf7;
        font-family: "Segoe UI", Roboto, system-ui, sans-serif;
        color: #7a7464;
        font-size: 13px;
      }
      @media (prefers-color-scheme: dark) {
        #boot {
          background: #101419;
          color: #9a9382;
        }
      }
      #boot .bar {
        width: 128px;
        height: 4px;
        border-radius: 999px;
        background: rgba(122, 116, 100, 0.18);
        overflow: hidden;
      }
      #boot .bar span {
        display: block;
        width: 34%;
        height: 100%;
        border-radius: 999px;
        background: #2e3fa8;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(300%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .bar span { animation: none; width: 100%; }
      }
      #root:not(:empty) + #boot { display: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot" role="status" aria-live="polite">
      <svg width="52" height="52" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="#2E3FA8" />
        <path d="M10 8h13v3.6h-9v3.1h8.1v3.5H14v3.2h9.2V25H10z" fill="#FFFFFF" />
        <rect x="10" y="26.4" width="4.4" height="1.8" fill="#E0A020" />
        <rect x="15.2" y="26.4" width="4.4" height="1.8" fill="#D4452B" />
        <rect x="20.4" y="26.4" width="2.8" height="1.8" fill="#1E8A5C" />
      </svg>
      <div class="bar"><span></span></div>
      <p>Chargement d'Ekuiseo…</p>
    </div>
    <noscript>
      <p style="padding: 24px; font-family: system-ui, sans-serif">
        Ekuiseo a besoin de JavaScript pour fonctionner. Activez-le dans votre navigateur.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
