server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Constat F343 : le point d entree, le service worker et le manifeste ne doivent
    # jamais etre servis depuis un cache heuristique apres un deploiement (page blanche,
    # import paresseux d un chunk disparu). Les assets hashes restent immuables.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(png|svg|ico|webp)$ {
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
